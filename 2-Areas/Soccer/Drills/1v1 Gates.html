<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1v1 Gates</title>
<style>
  :root {
    --bg: #f4f4f0; --ink: #1d1d1b; --muted: #5d5d58; --card: #ffffff;
    --field: #3f8a4a; --field-line: rgba(255,255,255,0.55);
    --cone: #f28c28; --player: #ffffff; --pass: #ffe14d; --run: #ffffff; --shot: #ff5a5a;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  .intro { margin: 0 0 20px; max-width: 70ch; }
  main.single { display: grid; grid-template-columns: minmax(0, 440px) 1fr; gap: 32px; align-items: start; }
  @media (max-width: 760px) { main.single { grid-template-columns: 1fr; } }
  .parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .part { background: var(--card); border-radius: 10px; padding: 14px; }
  svg { width: 100%; height: auto; border-radius: 8px; display: block; margin-bottom: 12px; }
  ol { padding-left: 1.2em; margin: 0; }
  li { margin-bottom: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 0.9rem; color: var(--muted); margin-top: 20px; }
  .legend svg { width: 40px; height: 16px; display: inline-block; vertical-align: middle; margin: 0 8px 0 0; border-radius: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pass)"/></marker>
    <marker id="a-run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--run)"/></marker>
    <marker id="a-shot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--shot)"/></marker>
    <g id="cone"><path d="M-12,10 L0,-13 L12,10 z" fill="var(--cone)" stroke="#8a4a0e" stroke-width="1.5"/></g>
  </defs>
</svg>
<!--
  Element snippets. Copy these exactly; change coordinates only.

  Field + end line (goal end at top):
    <rect width="460" height="470" fill="var(--field)"/>
    <rect x="12" y="12" width="436" height="446" fill="none" stroke="var(--field-line)" stroke-width="2"/>
    <line x1="12" y1="72" x2="448" y2="72" stroke="var(--field-line)" stroke-width="2"/>
  Goal:
    <path d="M126,72 L126,28 L286,28 L286,72" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  Pass (solid yellow):
    <path d="M84,418 L166,418" fill="none" stroke="var(--pass)" stroke-width="3" stroke-linecap="round" marker-end="url(#a-pass)"/>
  Movement (dotted white):
    <path d="M190,402 L182,332" fill="none" stroke="var(--run)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#a-run)"/>
  Dribble (wavy white). Draw along +x from 0,0, then translate to the start point and rotate to the heading in degrees.
  Add one "t10,0" per 10px of length:
    <path d="M0,0 q5,-6 10,0 t10,0 t10,0 t10,0 t10,0 t10,0" transform="translate(200,300) rotate(-90)" fill="none" stroke="var(--run)" stroke-width="2.5" marker-end="url(#a-run)"/>
  Shot (thick solid red):
    <path d="M200,228 L206,82" fill="none" stroke="var(--shot)" stroke-width="4" marker-end="url(#a-shot)"/>
  Spin (small circular arrow beside the player):
    <path d="M228,414 A12,12 0 1,1 220,398" fill="none" stroke="var(--run)" stroke-width="2.5" marker-end="url(#a-run)"/>
  Cone:
    <use href="#cone" x="138" y="208"/>
  Player:
    <text x="62" y="432" font-size="20" font-weight="700" fill="var(--player)" text-anchor="middle">X<tspan font-size="12" dy="-8">1</tspan></text>
  Goalkeeper:
    <text x="206" y="60" font-size="16" font-weight="700" fill="var(--player)" text-anchor="middle">GK</text>
  Step badge (fill = action color: var(--pass), var(--run), or var(--shot)):
    <circle cx="124" cy="400" r="11" fill="var(--pass)"/><text x="124" y="405" fill="#1d1d1b" font-size="13" font-weight="700" text-anchor="middle">1</text>
-->
<main class="single">
  <div>
    <h1>1v1 Gates</h1>
    <svg viewBox="0 0 460 470" role="img" aria-label="Drill diagram">
      <rect width="460" height="470" fill="var(--field)"/>
      <rect x="12" y="12" width="436" height="446" fill="none" stroke="var(--field-line)" stroke-width="2"/>
      <path d="M90,110 L390,110 L390,400" fill="none" stroke="var(--field-line)" stroke-width="2"/><use href="#cone" x="90" y="110"/><use href="#cone" x="90" y="210"/><use href="#cone" x="290" y="400"/><use href="#cone" x="390" y="400"/><path d="M125,386 L348,150" fill="none" stroke="var(--pass)" stroke-width="3" stroke-linecap="round" marker-end="url(#a-pass)"/><path d="M140,398 L262,270" fill="none" stroke="var(--run)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#a-run)"/><path d="M0,0 q5,-6 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0" transform="translate(348,152) rotate(180)" fill="none" stroke="var(--run)" stroke-width="2.5" marker-end="url(#a-run)"/><path d="M0,0 q5,-6 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0" transform="translate(340,160) rotate(90)" fill="none" stroke="var(--run)" stroke-width="2.5" marker-end="url(#a-run)"/><text x="110" y="406" font-size="20" font-weight="700" fill="var(--player)" text-anchor="middle">X<tspan font-size="12" dy="-8">1</tspan></text><text x="366" y="142" font-size="20" font-weight="700" fill="var(--player)" text-anchor="middle">X<tspan font-size="12" dy="-8">2</tspan></text><circle cx="222" cy="252" r="11" fill="var(--pass)"/><text x="222" y="257" fill="#1d1d1b" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="216" cy="350" r="11" fill="var(--run)"/><text x="216" y="355" fill="#1d1d1b" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="235" cy="132" r="11" fill="var(--run)"/><text x="235" y="137" fill="#1d1d1b" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="362" cy="270" r="11" fill="var(--run)"/><text x="362" y="275" fill="#1d1d1b" font-size="13" font-weight="700" text-anchor="middle">3</text>
    </svg>
  </div>
  <div>
    <h2>Sequence</h2>
    <ol>
      <li>X1 passes to X2.</li>
      <li>X1 runs to close down X2 and tries to kick the ball out or win it.</li>
      <li>X2 dribbles through either gate.</li>
    </ol>
    <div class="legend">
      <div><svg viewBox="0 0 40 16"><path d="M20,2 L28,14 L12,14 z" fill="var(--cone)"/></svg>Cone</div>
      <div><svg viewBox="0 0 40 16"><rect width="40" height="16" fill="var(--field)"/><line x1="2" y1="8" x2="38" y2="8" stroke="var(--pass)" stroke-width="3"/></svg>Pass</div>
      <div><svg viewBox="0 0 40 16"><rect width="40" height="16" fill="var(--field)"/><line x1="2" y1="8" x2="38" y2="8" stroke="var(--run)" stroke-width="2.5" stroke-dasharray="2 5"/></svg>Movement</div>
      <div><svg viewBox="0 0 40 16"><rect width="40" height="16" fill="var(--field)"/><path d="M2,8 q4,-5 8,0 t8,0 t8,0 t8,0" fill="none" stroke="var(--run)" stroke-width="2.5"/></svg>Dribble</div>
    </div>
  </div>
</main>
</body>
</html>
